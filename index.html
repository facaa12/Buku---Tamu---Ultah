<!DOCTYPE html>
 <html lang="id">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Buku Tamu Ulang Tahun</title>
     <style>
         * {
             margin: 0;
             padding: 0;
             box-sizing: border-box;
             font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
         }
         body {
             background: linear-gradient(135deg, rgba(255, 228, 235, 0.85), rgba(255, 240, 245, 0.85));
             min-height: 100vh;
             padding: 20px;
         }
         .container {
             max-width: 700px;
             margin: 0 auto;
         }
         h1 {
             text-align: center;
             color: #d64880;
             font-size: 2rem;
             margin-bottom: 5px;
         }
         .subtitle {
             text-align: center;
             color: #b04070;
             font-size: 1.1rem;
             margin-bottom: 30px;
         }
         /* === KOTAK STATISTIK === */
         .stats-box {
             background: rgba(255, 255, 255, 0.7);
             backdrop-filter: blur(10px);
             border-radius: 16px;
             padding: 20px;
             margin-bottom: 30px;
             box-shadow: 0 4px 20px rgba(214, 72, 128, 0.15);
             border: 1px solid rgba(255, 255, 255, 0.5);
         }
         .stats-box h2 {
             color: #b04070;
             font-size: 1.2rem;
             margin-bottom: 15px;
             text-align: center;
         }
         .stats-row {
             display: flex;
             justify-content: space-around;
             gap: 15px;
         }
         .stat-item {
             text-align: center;
             flex: 1;
             padding: 15px;
             border-radius: 12px;
             background: rgba(255, 255, 255, 0.6);
         }
         .stat-item h3 {
             font-size: 1rem;
             color: #883058;
             margin-bottom: 8px;
         }
         .stat-item p {
             font-size: 1.8rem;
             font-weight: bold;
             color: #d64880;
         }
         /* === FORMULIR === */
         .form-box {
             background: rgba(255, 255, 255, 0.7);
             backdrop-filter: blur(10px);
             border-radius: 16px;
             padding: 30px;
             margin-bottom: 30px;
             box-shadow: 0 4px 20px rgba(214, 72, 128, 0.15);
             border: 1px solid rgba(255, 255, 255, 0.5);
         }
         .form-box h2 {
             color: #b04070;
             font-size: 1.3rem;
             margin-bottom: 20px;
             text-align: center;
         }
         label {
             display: block;
             margin-bottom: 8px;
             color: #883058;
             font-weight: 500;
         }
         input[type="text"], textarea, select {
             width: 100%;
             padding: 12px 15px;
             margin-bottom: 20px;
             border: 1px solid #f0c8d8;
             border-radius: 10px;
             font-size: 1rem;
             background: rgba(255, 255, 255, 0.8);
             color: #555;
             transition: border 0.3s ease;
         }
         input:focus, textarea:focus, select:focus {
             outline: none;
             border-color: #d64880;
         }
         textarea {
             min-height: 100px;
             resize: vertical;
         }
         .radio-group {
             display: flex;
             gap: 25px;
             margin-bottom: 20px;
             flex-wrap: wrap;
         }
         .radio-item {
             display: flex;
             align-items: center;
             gap: 8px;
             cursor: pointer;
         }
         input[type="radio"] {
             accent-color: #d64880;
             width: 18px;
             height: 18px;
         }
         button {
             width: 100%;
             padding: 14px;
             background: linear-gradient(135deg, #d64880, #e86898);
             color: white;
             border: none;
             border-radius: 10px;
             font-size: 1rem;
             font-weight: 600;
             cursor: pointer;
             transition: transform 0.2s ease, box-shadow 0.2s ease;
         }
         button:hover {
             transform: translateY(-2px);
             box-shadow: 0 5px 15px rgba(214, 72, 128, 0.3);
         }
         button:active {
             transform: translateY(0);
         }
         /* === DAFTAR UCAPAN === */
         .ucapan-box {
             background: rgba(255, 255, 255, 0.7);
             backdrop-filter: blur(10px);
             border-radius: 16px;
             padding: 30px;
             box-shadow: 0 4px 20px rgba(214, 72, 128, 0.15);
             border: 1px solid rgba(255, 255, 255, 0.5);
         }
         .ucapan-box h2 {
             color: #b04070;
             font-size: 1.3rem;
             margin-bottom: 20px;
             text-align: center;
         }
         .ucapan-item {
             padding: 18px;
             background: rgba(255, 235, 242, 0.5);
             border-radius: 10px;
             margin-bottom: 15px;
             border-left: 4px solid #d64880;
         }
         .ucapan-nama {
             font-weight: 600;
             color: #b04070;
             margin-bottom: 5px;
         }
         .ucapan-status {
             display: inline-block;
             font-size: 0.75rem;
             padding: 2px 8px;
             border-radius: 12px;
             margin-left: 8px;
         }
         .status-hadir {
             background: #d4f8e8;
             color: #208060;
         }
         .status-tidak {
             background: #fde0e8;
             color: #b04070;
         }
         .ucapan-teks {
             color: #555;
             line-height: 1.5;
         }
         .empty-msg {
             text-align: center;
             color: #b898a8;
             font-style: italic;
             padding: 20px;
         }
         /* === RESPONSIF HP === */
         @media (max-width: 600px) {
             h1 {
                 font-size: 1.5rem;
             }
             .subtitle {
                 font-size: 0.95rem;
             }
             .stats-row {
                 flex-direction: column;
             }
             .form-box, .ucapan-box, .stats-box {
                 padding: 20px;
             }
             .radio-group {
                 flex-direction: column;
                 gap: 10px;
             }
             button {
                 padding: 12px;
             }
         }
     </style>
 </head>
 <body>
     <div class="container">
         <h1>🎂 Buku Tamu Ulang Tahun</h1>
         <p class="subtitle">Silakan tinggalkan ucapan dan konfirmasi kehadiran Anda</p>
         <!-- === STATISTIK === -->
         <div class="stats-box">
             <h2>📊 Statistik Kehadiran</h2>
             <div class="stats-row">
                 <div class="stat-item">
                     <h3>Akan Hadir</h3>
                     <p id="count-hadir">0</p>
                 </div>
                 <div class="stat-item">
                     <h3>Tidak Hadir</h3>
                     <p id="count-tidak">0</p>
                 </div>
             </div>
         </div>
         <!-- === FORMULIR === -->
         <div class="form-box">
             <h2>✍️ Isi Buku Tamu</h2>
             <form id="guest-form">
                 <label for="nama">Nama</label>
                 <input type="text" id="nama" placeholder="Masukkan nama Anda..." required>
                 <label for="kehadiran">Status Kehadiran</label>
                 <div class="radio-group">
                     <label class="radio-item">
                         <input type="radio" name="kehadiran" value="Hadir" required>
                         Akan Hadir 🎉
                     </label>
                     <label class="radio-item">
                         <input type="radio" name="kehadiran" value="Tidak Hadir">
                         Maaf, Tidak Bisa 😊
                     </label>
                 </div>
                 <label for="ucapan">Ucapan & Doa</label>
                 <textarea id="ucapan" placeholder="Tulis ucapan dan doa untuk yang berulang tahun..." required></textarea>
                 <button type="submit">Kirim Ucapan ✨</button>
             </form>
         </div>
         <!-- === DAFTAR UCAPAN === -->
         <div class="ucapan-box">
             <h2>💌 Daftar Ucapan</h2>
             <div id="daftar-ucapan">
                 <p class="empty-msg">Belum ada ucapan. Jadilah yang pertama!</p>
             </div>
         </div>
     </div>
     <script>
         let daftarTamu = [];
         // Ambil dari localStorage kalau ada
         if(localStorage.getItem('daftarTamu')) {
             daftarTamu = JSON.parse(localStorage.getItem('daftarTamu'));
             renderUcapan();
             updateStats();
         }
         // Kirim formulir
         document.getElementById('guest-form').addEventListener('submit', function(e) {
             e.preventDefault();
             const nama = document.getElementById('nama').value.trim();
             const ucapan = document.getElementById('ucapan').value.trim();
             const kehadiran = document.querySelector('input[name="kehadiran"]:checked').value;
             const tamuBaru = {
                 nama: nama,
                 ucapan: ucapan,
                 kehadiran: kehadiran,
                 waktu: new Date().toLocaleString('id-ID')
             };
             daftarTamu.unshift(tamuBaru);
             localStorage.setItem('daftarTamu', JSON.stringify(daftarTamu));
             renderUcapan();
             updateStats();
             // Reset form
             this.reset();
             alert('Terima kasih atas ucapan Anda! 🎉');
         });
         function updateStats() {
             const jumlahHadir = daftarTamu.filter(t => t.kehadiran === 'Hadir').length;
             const jumlahTidak = daftarTamu.filter(t => t.kehadiran === 'Tidak Hadir').length;
             document.getElementById('count-hadir').textContent = jumlahHadir;
             document.getElementById('count-tidak').textContent = jumlahTidak;
         }
         function renderUcapan() {
             const wadah = document.getElementById('daftar-ucapan');
             
             if(daftarTamu.length === 0) {
                 wadah.innerHTML = '<p class="empty-msg">Belum ada ucapan. Jadilah yang pertama!</p>';
                 return;
             }
             wadah.innerHTML = daftarTamu.map(tamu => `
                 <div class="ucapan-item">
                     <div class="ucapan-nama">
                         ${tamu.nama}
                         <span class="ucapan-status ${tamu.kehadiran === 'Hadir' ? 'status-hadir' : 'status-tidak'}">
                             ${tamu.kehadiran === 'Hadir' ? '✅ Hadir' : '❌ Tidak Hadir'}
                         </span>
                     </div>
                     <p class="ucapan-teks">${tamu.ucapan}</p>
                     <small style="color:#b898a8;font-size:0.75rem;">${tamu.waktu}</small>
                 </div>
             `).join('');
         }
     </script>
 </body>
 </html>
